services:
  postgres-test:
    image: postgres:17-alpine
    container_name: dcrustverse-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dcrust_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dcrust_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    container_name: dcrustverse-test-runner
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres-test:5432/dcrust_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@postgres-test:5432/dcrust_test?sslmode=disable
    depends_on:
      postgres-test:
        condition: service_healthy
    command: ["npm", "test"]
